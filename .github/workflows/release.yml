# A version tag (v1.2.3) builds the signed per-ABI APKs and publishes them as a GitHub
# Release. The key comes from repository secrets (docs/RELEASING.md), never the repo.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LOOKEE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-pinned
      - name: Go tests
        run: make test
      - uses: ./.github/actions/android-toolchain
      - name: Go version
        # The core must build with the toolchain go.mod pins (a different Go crashed 1.0.0 on the box).
        run: |
          want=$(sed -n 's/^toolchain //p' core/go.mod)
          got=$(cd "$RUNNER_TEMP" && go env GOVERSION)
          echo "go.mod pins $want, building with $got"
          test "$want" = "$got"
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.LOOKEE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::LOOKEE_KEYSTORE_BASE64 secret is missing (docs/RELEASING.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lookee-release.jks"
          echo "LOOKEE_KEYSTORE=$RUNNER_TEMP/lookee-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs
        env:
          LOOKEE_KEYSTORE_PASSWORD: ${{ secrets.LOOKEE_KEYSTORE_PASSWORD }}
        run: |
          export LOOKEE_VERSION="${LOOKEE_VERSION#v}"
          make release
      - name: Check the signature and the Go inside
        run: |
          want=$(sed -n 's/^toolchain //p' core/go.mod)
          for f in app/build/outputs/apk/release/*-release.apk; do
            got=$(unzip -p "$f" 'lib/*/libgojni.so' | strings | grep -m1 -oE 'go1\.[0-9]+\.[0-9]+')
            echo "$(basename "$f"): Go $got"
            test "$got" = "$want" || { echo "::error::$f was built with $got, not $want"; exit 1; }
          done
          for f in app/build/outputs/apk/release/*-release.apk; do
            "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$f" | grep "SHA-256"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/lookee-$v-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "lookee $v" --generate-notes
      - name: Update the README's release badge
        # Served from the repo: GitHub's image proxy dropped the live shields.io badge.
        run: |
          git fetch -q origin main && git checkout -q -B main origin/main
          curl -sf "https://img.shields.io/badge/release-${GITHUB_REF_NAME}-F2B544" -o docs/badges/release.svg
          if ! git diff --quiet docs/badges/release.svg; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "README: release badge ${GITHUB_REF_NAME}" docs/badges/release.svg
            git push -q origin main
          fi
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/lookee-release.jks"
